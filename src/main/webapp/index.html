<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#0B5FFF"/>
    <title>Encurtador de URL - TOPAZ</title>

    <!--
        React via CDN (sem build step). O Babel compila o JSX no navegador.
        Isso mantem o frontend simples e empacotado no proprio .war.
        Em producao usariamos um build (Vite) gerando estaticos.
    -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /*
            Paleta baseada na identidade visual da TOPAZ (tema claro, azul de
            fintech sobre fundo claro). Se voce tiver o azul exato do guia de
            marca, basta trocar --brand-primary e --brand-primary-dark.
        */
        :root {
            --brand-primary: #0B5FFF;
            --brand-primary-dark: #0844C7;
            --brand-navy: #0A1B3D;
            --bg: #EEF2F9;
            --surface: #FFFFFF;
            --text: #1A2338;
            --muted: #667085;
            --border: #E1E7F0;
            --success: #0E9F6E;
            --error: #E02424;
            --radius: 14px;
            --shadow: 0 10px 40px rgba(10, 27, 61, 0.10);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: radial-gradient(1200px 600px at 50% -10%, #DDE7FA 0%, var(--bg) 55%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .brand .logo {
            width: 34px; height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-dark));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 800; font-size: 18px;
        }
        .brand .name { font-weight: 800; letter-spacing: 1px; color: var(--brand-navy); }

        h1 { font-size: 24px; margin: 0 0 6px; color: var(--brand-navy); }
        .subtitle { margin: 0 0 26px; color: var(--muted); font-size: 15px; }

        label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--brand-navy); }
        .field { margin-bottom: 18px; }
        .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 13px 14px;
            font-size: 15px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(11, 95, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: var(--brand-primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background .15s;
        }
        button:hover:not(:disabled) { background: var(--brand-primary-dark); }
        button:disabled { opacity: .6; cursor: not-allowed; }

        .alert {
            margin-top: 20px;
            padding: 13px 15px;
            border-radius: 10px;
            font-size: 14px;
            border: 1px solid;
        }
        .alert.error { color: var(--error); background: #FDECEC; border-color: #F7C8C8; }

        .result {
            margin-top: 22px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #F7F9FD;
        }
        .result .label-row { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
        .result .url-row { display: flex; gap: 10px; align-items: center; }
        .result a {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
            color: var(--brand-primary);
            word-break: break-all;
            text-decoration: none;
        }
        .result a:hover { text-decoration: underline; }
        .copy-btn {
            width: auto;
            padding: 9px 14px;
            font-size: 13px;
            background: var(--brand-navy);
            white-space: nowrap;
        }
        .copy-btn:hover:not(:disabled) { background: #060f22; }
        .copy-btn.copied { background: var(--success); }
        .original { margin-top: 12px; font-size: 12px; color: var(--muted); word-break: break-all; }

        footer { margin-top: 26px; text-align: center; font-size: 12px; color: var(--muted); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [url, setUrl] = useState("");
            const [alias, setAlias] = useState("");
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(false);
            const [copied, setCopied] = useState(false);

            async function handleSubmit(event) {
                event.preventDefault();
                setError(null);
                setResult(null);
                setCopied(false);

                if (!url.trim()) {
                    setError("Informe uma URL para encurtar.");
                    return;
                }

                setLoading(true);
                try {
                    const payload = { url: url.trim() };
                    if (alias.trim()) {
                        payload.alias = alias.trim();
                    }

                    // URL relativa: resolve para <context-path>/api/urls
                    const response = await fetch("api/urls", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    let data = null;
                    try { data = await response.json(); } catch (e) { /* corpo vazio/nao-json */ }

                    if (!response.ok) {
                        setError((data && data.message) || ("Erro " + response.status + "."));
                    } else {
                        setResult(data);
                    }
                } catch (e) {
                    setError("Nao foi possivel conectar ao servidor.");
                } finally {
                    setLoading(false);
                }
            }

            function copyToClipboard() {
                if (!result) return;
                navigator.clipboard.writeText(result.shortUrl).then(function () {
                    setCopied(true);
                    setTimeout(function () { setCopied(false); }, 2000);
                });
            }

            return (
                <div className="card">
                    <div className="brand">
                        <div className="logo">T</div>
                        <div className="name">TOPAZ</div>
                    </div>

                    <h1>Encurtador de URL</h1>
                    <p className="subtitle">Cole um link, escolha um apelido opcional e gere uma URL curta.</p>

                    <form onSubmit={handleSubmit}>
                        <div className="field">
                            <label htmlFor="url">URL original</label>
                            <input
                                id="url"
                                type="text"
                                placeholder="https://exemplo.com/pagina-bem-longa"
                                value={url}
                                onChange={function (e) { setUrl(e.target.value); }}
                            />
                        </div>

                        <div className="field">
                            <label htmlFor="alias">Apelido (opcional)</label>
                            <input
                                id="alias"
                                type="text"
                                placeholder="meu-link"
                                value={alias}
                                onChange={function (e) { setAlias(e.target.value); }}
                            />
                            <div className="hint">3 a 20 caracteres: letras, numeros, hifen e underscore.</div>
                        </div>

                        <button type="submit" disabled={loading}>
                            {loading ? "Gerando..." : "Gerar URL curta"}
                        </button>
                    </form>

                    {error && <div className="alert error">{error}</div>}

                    {result && (
                        <div className="result">
                            <div className="label-row">Sua URL curta</div>
                            <div className="url-row">
                                <a href={result.shortUrl} target="_blank" rel="noopener noreferrer">
                                    {result.shortUrl}
                                </a>
                                <button
                                    type="button"
                                    className={"copy-btn" + (copied ? " copied" : "")}
                                    onClick={copyToClipboard}
                                >
                                    {copied ? "Copiado!" : "Copiar"}
                                </button>
                            </div>
                            <div className="original">Redireciona para: {result.originalUrl}</div>
                        </div>
                    )}

                    <footer>Desafio Tecnico &middot; TOPAZ</footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
