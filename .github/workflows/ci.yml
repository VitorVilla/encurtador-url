name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configura o JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Compila, roda os testes e empacota o .war
        run: mvn -B clean package

      - name: Publica o .war como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: encurtador-url-war
          path: target/encurtador-url.war
